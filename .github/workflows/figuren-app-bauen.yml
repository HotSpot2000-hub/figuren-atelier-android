name: Figuren-App bauen
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enthaltenen Quellcode bereitstellen
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, io, zipfile
          archive = base64.b64decode("")
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              z.extractall('.')
          PYCODE
      - name: Android SDK bereitstellen
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: APK bauen und Lint prüfen
        run: gradle --no-daemon -p figuren-app :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Figuren-Atelier-APK
          path: figuren-app/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Figuren-Atelier-Quellcode
          path: figuren-app/


name: TripoSR · lokaler Techniktest
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Festen Testschlüssel bereitstellen
      env:
        SIGNING_INPUT: ${{ secrets.FIGUREN_TEST_KEYSTORE_BASE64 }}
      shell: bash
      run: |
        python3 - <<'PYCODE'
        import os, base64, hashlib
        from pathlib import Path
        value = os.environ.get('SIGNING_INPUT', '').strip()
        if not value:
            raise SystemExit('Bitte zuerst das Repository-Geheimnis FIGUREN_TEST_KEYSTORE_BASE64 mit dem Inhalt von Signierung.txt anlegen.')
        try:
            data = base64.b64decode(''.join(value.split()), validate=True)
        except Exception:
            raise SystemExit('Signierungsgeheimnis ist kein gültiges Base64. Den vollständigen Inhalt von Signierung.txt verwenden.')
        if hashlib.sha256(data).hexdigest() != '28dabaeab076987b8d2bab28102678851370f6fdcffd60958d311d33c1b2703d':
            raise SystemExit('Der Signierschlüssel stimmt nicht mit dieser Test-App überein.')
        target = Path(os.environ['RUNNER_TEMP']) / 'figuren-test.jks'
        target.write_bytes(data)
        target.chmod(0o600)
        with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write('FIGUREN_KEYSTORE=' + str(target) + '\n')
        PYCODE
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - name: TripoSR-Testquellcode bereitstellen
      shell: bash
      run: |-
        python3 - <<'PYCODE'
        import io,zipfile,base64
        from pathlib import Path
        data=base64.b64decode('')
        Path('triposr-test-quellcode.zip').write_bytes(data)
        with zipfile.ZipFile(io.BytesIO(data)) as z:z.extractall('.')
        PYCODE
    - name: Android SDK bereitstellen
      run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
    - name: Test-APK kompilieren und Lint prüfen
      run: gradle --no-daemon -p triposr-android :app:assembleDebug :app:lintDebug
    - name: Offline-Regeln und Modellverpackung prüfen
      run: |-
        python triposr-android/verify_apk.py
        "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose triposr-android/app/build/outputs/apk/debug/app-debug.apk
    - uses: actions/upload-artifact@v4
      with:
        name: TripoSR-Techniktest-APK
        path: triposr-android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
    - name: Baubericht bereitstellen
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: TripoSR-Baubericht
        path: triposr-android/app/build/reports/lint-results-debug.*
        if-no-files-found: ignore
    - name: Quellcode bereitstellen
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: TripoSR-Testquellcode
        path: triposr-test-quellcode.zip
        if-no-files-found: ignore
    - name: Temporären Signierschlüssel entfernen
      if: always()
      shell: bash
      run: |
        python3 - <<'PYCODE'
        import os
        from pathlib import Path
        (Path(os.environ['RUNNER_TEMP']) / 'figuren-test.jks').unlink(missing_ok=True)
        PYCODE
